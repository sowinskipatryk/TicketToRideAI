# TicketToRideAI Configuration File

# NEAT Training Configuration
neat:
  players_num: 2
  game_version: "USA"  # Options: USA, Europe
  num_generations: 100
  max_moves_per_game: 1000
  config_filename: "neuroevolution/neat_config.txt"
  genome_filename: "checkpoints/neat/best_genome.pkl"

# Logging Configuration
logging:
  console_level: "WARNING"  # Options: DEBUG, INFO, WARNING, ERROR, CRITICAL
  file_level: "ERROR"     # Options: DEBUG, INFO, WARNING, ERROR, CRITICAL
  log_file: "game.log"

# Game Configuration
game:
  default_version: "USA"  # Options: USA, Europe
  min_players: 2
  max_players: 5

